<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="演示：向 Claude 提问后返回聊天记录时间线">
  <style>
    .win  { fill:#0d1117; stroke:#30363d; stroke-width:1; }
    .bar  { fill:#161b22; }
    .t    { fill:#c9d1d9; font-size:20px; white-space:pre; }
    .u    { fill:#7ee787; }
    .c    { fill:#79c0ff; }
    .dim  { fill:#8b949e; }
    .ttl  { fill:#8b949e; font-size:12px; }
    .line { opacity:0; }
    .l1 { animation:l1 13s infinite; }
    .l2 { animation:l2 13s infinite; }
    .l3 { animation:l3 13s infinite; }
    .l4 { animation:l4 13s infinite; }
    .l5 { animation:l5 13s infinite; }
    .l6 { animation:l6 13s infinite; }
    .l7 { animation:l7 13s infinite; }
    .caret { animation:blink 1s step-end infinite, l2 13s infinite; }
    @keyframes blink { 0%,49%{fill-opacity:1} 50%,100%{fill-opacity:0} }
    @keyframes l1 { 0%,3%{opacity:0} 6%,86%{opacity:1} 92%,100%{opacity:0} }
    @keyframes l2 { 0%,7%{opacity:0} 10%,86%{opacity:1} 92%,100%{opacity:0} }
    @keyframes l3 { 0%,20%{opacity:0} 24%,86%{opacity:1} 92%,100%{opacity:0} }
    @keyframes l4 { 0%,27%{opacity:0} 31%,86%{opacity:1} 92%,100%{opacity:0} }
    @keyframes l5 { 0%,34%{opacity:0} 38%,86%{opacity:1} 92%,100%{opacity:0} }
    @keyframes l6 { 0%,41%{opacity:0} 45%,86%{opacity:1} 92%,100%{opacity:0} }
    @keyframes l7 { 0%,50%{opacity:0} 54%,86%{opacity:1} 92%,100%{opacity:0} }
  </style>

  <rect class="win" x="0.5" y="0.5" width="759" height="379" rx="8"/>
  <rect class="bar" x="0.5" y="0.5" width="759" height="34" rx="8"/>
  <rect class="bar" x="0.5" y="18" width="759" height="17"/>
  <circle cx="20" cy="17.5" r="5" fill="#ff5f56"/>
  <circle cx="38" cy="17.5" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="17.5" r="5" fill="#27c93f"/>
  <text class="ttl" x="380" y="22" text-anchor="middle">wechat-to-ai  ·  Claude Code</text>

  <g transform="translate(22,64)">
    <text class="t line l1" x="0"  y="0"><tspan class="u">你     ❯</tspan> 帮我找和张雪峰的聊天，他说过「我不会走的」</text>
    <text class="t line l2" x="0"  y="24" xml:space="preserve">         大概是去年冬天<tspan class="caret" dx="2">▋</tspan></text>

    <text class="t line l3" x="0"  y="72"><tspan class="c">Claude ❯</tspan> <tspan class="dim">扫描 6,412 条消息，找到 1 条匹配。</tspan></text>
    <text class="t line l4" x="0"  y="108">         2024-12-07 23:14</text>
    <text class="t line l5" x="0"  y="136">         <tspan class="dim">张雪峰：</tspan>你跑不过我你信吗？我不会走的！</text>
    <text class="t line l6" x="0"  y="164">         <tspan class="dim">上下文：</tspan>前一条消息是「我三口一根巧乐兹」，你们在聊吃雪糕</text>

    <text class="t line l7" x="0"  y="212"><tspan class="dim">→ 已写入 聊天记录/张雪峰.txt</tspan></text>
  </g>
</svg>
